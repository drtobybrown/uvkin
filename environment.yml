# Example conda environment (trim paths / versions for your site).
name: uvkin
channels:
  - conda-forge
dependencies:
  - python>=3.10
  - pip
  - numpy>=1.24
  - scipy>=1.10
  - astropy>=5.3
  - pyyaml>=6.0
  - pip:
      # Pin or install uvfit from a branch that matches this uvkin checkout
