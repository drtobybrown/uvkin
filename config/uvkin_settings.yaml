# uvkin pipeline settings — KILOGAS DR1
# =============================================================================
# Read top-to-bottom in the order the pipeline executes:
#   1. shared      — grid, rest frequency, global velocity buffer, weight scaling
#   2. galaxies    — per-galaxy catalogue (paths, astrometry, kinematic seeds)
#   3. aggregation — visibility averaging / binning (spectral bin factor lives here)
#   4. mcmc_bounds — flat box priors on forward-model parameters (physics)
#   5. mcmc_sampler— emcee algorithm knobs (walker initial spread; not spectral binning)
#
# Phase-centre (dx, dy) seeds: each galaxy may set ``phase_centroid_seed_arcsec``.
# If omitted, ``aggregation.default_phase_centroid_seed_arcsec`` is used (galaxy wins).
# =============================================================================
shared:
  default_channel_width_kms: 1.2699254451290471
  cellsize_arcsec: 0.1   # Gold standard for 0.32 kpc resolution
  nx: 256
  ny: 256
  vel_buffer_kms: 100.0  # Vital for noise-floor (diagnostic) baseline
  f_rest_hz: 230538000000.0
  c_kms: 299792.458
  weight_scale_factor: 0.5   # Hanning smoothing covariance correction; 1.0 = no correction

# -----------------------------------------------------------------------------
# Galaxy catalogue (see catalogues/kgas007_066_catalogue.csv where noted).
#
# ``pa_init`` is the RECEDING-side major-axis PA (East-of-North).
# ``ra_deg``, ``dec_deg`` — ICRS; run_kgas_full compares MS PHASE_DIR in the .npz.
# Field order per galaxy: ids/paths → astrometry → kinematics → band/flux → geometry → phase seed.
# -----------------------------------------------------------------------------
galaxies:
  KGAS007:
    kilogas_archive_id: KILOGAS007
    data_path_default: /arc/projects/KILOGAS/analysis/toby_sandbox/visibilities/KILOGAS007.npz
    ra_deg: 146.576065
    dec_deg: 2.88434
    vsys: 14229.0              # cz from catalogue z=0.047463 (no VHI)
    vhi_kms: null               # provenance only when unavailable
    r_scale: 3.0                # ~Re_R_arcsec from catalogue
    pa_init: 212.6              # KinMS posAng seed (receding-side convention)
    inc_init: 28.9              # acos(ba) from catalogue axis ratio
    obs_freq_range_ghz: [219.999, 220.205]
    flux_int_jy_kms: 24.132
    phase_centroid_seed_arcsec: [0.0, 0.0]

  KGAS066:
    kilogas_archive_id: KILOGAS066
    data_path_default: /arc/projects/KILOGAS/analysis/toby_sandbox/visibilities/KILOGAS066.npz
    ra_deg: 345.667969
    dec_deg: 13.32909
    vhi_kms: 8305.0
    vsys: 8299.563
    r_scale: 3.0
    pa_init: 205.212
    inc_init: 51.690
    vmax_seed_kms: 184.034     # moment1-seeded; used before obs-band fallback
    vel_buffer_kms: 100.494     # spectral trim / diagnostic line-mask buffer
    flux_int_jy_kms: 160.055473
    obs_freq_range_ghz: [224.148, 224.506]
    phase_centroid_seed_arcsec: [0.0, 0.0]

# -----------------------------------------------------------------------------
# Visibility aggregation (after a galaxy is chosen).
# -----------------------------------------------------------------------------
aggregation:
  # Default (dx, dy) arcsec when a galaxy omits phase_centroid_seed_arcsec.
  default_phase_centroid_seed_arcsec: [0.0, 0.0]
  uv_bin_size_m: 10.0
  time_bin_s: 30.0
  apply_uv_binning: true
  apply_time_averaging: true
  spectral_bin_factor: 8      # ~10 km/s channels on KGAS066 after trim

# -----------------------------------------------------------------------------
# MCMC flat box priors (physics). vmax / r_scale use multipliers on the run seeds.
# -----------------------------------------------------------------------------
mcmc_bounds:
  vsys_offset_kms: [-200.0, 200.0]
  gas_sigma: [3.0, 80.0]
  flux_multipliers: [0.05, 10.0]
  gamma: [0.0, 2.0]
  inc_half_width_deg: 90.0
  pa_half_width_deg: 180.0
  dx_half_width_arcsec: 5.0
  dy_half_width_arcsec: 5.0
  vmax_multipliers: [0.25, 4.0]
  r_scale_multipliers: [0.25, 4.0]

# -----------------------------------------------------------------------------
# emcee tuning (not spectral rebinning). initial_ball_fraction scales the Gaussian
# ball around MAP seeds as a fraction of each parameter's prior box width (uvfit 0.2+).
# -----------------------------------------------------------------------------
mcmc_sampler:
  initial_ball_fraction: 1.0e-4
