# Diagnostic MCMC profile: open_explore priors + ~30 km/s spectral binning
# aligned with KILOGAS 30kms imaging products.
# Use: python run_kgas_full.py ... --pipeline-settings config/uvkin_settings_diagnose_30kms.yaml
#
# Moment-map integration (kinms_test fixes ported into uvkin):
#   --use-imaging-seeds        Replaces catalogue seeds (PA, inc, vsys, vmax,
#                              r_scale, gas_sigma, dx, dy, integrated flux)
#                              with values derived from the imaging_products
#                              below. Also activates imaging-tightened priors
#                              by default (see --no-imaging-tight-priors to
#                              disable). Tight priors: pa/inc ±15°, vsys ±50
#                              km/s, flux/vmax/r_scale [0.25×, 4×] of seed,
#                              gas_sigma [0.5×, 2×] of seed, dx/dy ±2".
#   --write-preflight-cube     Build a KinMS inClouds cube from moment maps,
#                              write Jy/beam FITS on the observed WCS
#                              template, and save observed/simulated/
#                              comparison PNGs under outdir/preflight_inclouds/.
#                              Default: on when imaging_products.cube/mom0/mom1
#                              are present.
# The YAML mcmc_bounds block below is the **fallback** when --use-imaging-seeds
# is absent or imaging products are unavailable (e.g. KGAS007).
# =============================================================================
shared:
  default_channel_width_kms: 1.2699254451290471
  cellsize_arcsec: 0.1
  nx: 256
  ny: 256
  vel_buffer_kms: 100.0
  f_rest_hz: 230538000000.0
  c_kms: 299792.458
  weight_scale_factor: 0.5

galaxies:
  KGAS007:
    kilogas_archive_id: KILOGAS007
    data_path_default: /arc/projects/KILOGAS/analysis/toby_sandbox/visibilities/KILOGAS007.npz
    ra_deg: 146.576065
    dec_deg: 2.88434
    vsys: 14229.0
    vhi_kms: null
    r_scale: 3.0
    pa_init: 212.6
    inc_init: 28.9
    obs_freq_range_ghz: [219.999, 220.205]
    flux_int_jy_kms: 24.132
    phase_centroid_seed_arcsec: [0.0, 0.0]

  KGAS066:
    kilogas_archive_id: KILOGAS066
    data_path_default: /arc/projects/KILOGAS/analysis/toby_sandbox/visibilities/KILOGAS066.npz
    ra_deg: 345.667969
    dec_deg: 13.32909
    vhi_kms: 8305.0
    vsys: 8299.563
    r_scale: 3.0
    pa_init: 205.212
    inc_init: 51.690
    vmax_seed_kms: 184.034
    vel_buffer_kms: 100.494
    flux_int_jy_kms: 160.055473
    obs_freq_range_ghz: [224.148, 224.506]
    phase_centroid_seed_arcsec: [0.0, 0.0]
    imaging_products:
      cube: /arc/projects/KILOGAS/products/v1.2/original/by_galaxy/KGAS66/30kms/KGAS66_clipped_cube.fits
      mom0: /arc/projects/KILOGAS/products/v1.2/original/by_galaxy/KGAS66/30kms/KGAS66_Ico_K_kms-1.fits
      mom1: /arc/projects/KILOGAS/products/v1.2/original/by_galaxy/KGAS66/30kms/KGAS66_mom1.fits
      mom2: /arc/projects/KILOGAS/products/v1.2/original/by_galaxy/KGAS66/30kms/KGAS66_mom2.fits
      channel_width_kms: 30.0

aggregation:
  default_phase_centroid_seed_arcsec: [0.0, 0.0]
  uv_bin_size_m: 10.0
  time_bin_s: 30.0
  apply_uv_binning: true
  apply_time_averaging: true
  spectral_bin_factor: 24   # 24 × 1.27 km/s ≈ 30.5 km/s

# Moment-derived box priors (kinms_test KGAS066 reference; see comment block at top).
# These ranges mirror what `--use-imaging-seeds --imaging-tight-priors` derives at
# runtime, so the YAML and runtime paths converge on the same answer.  Use the
# open_explore profile if you need wider bounds for a non-imaged galaxy.
#
#   pa, inc  : ±15° around catalogue seed (PA wraps; inc clamped to [0, 90])
#   vsys     : catalogue ± 50 km/s
#   gas_sigma: [dv_floor, 100] km/s (lower bound floored to current binned dv)
#   flux     : [0.5×, 2×] of imaging-derived integrated Jy·km/s (catalogue seed
#              if no imaging products available)
#   gamma    : full prior [0, 2]
#   vmax,    : [0.25×, 4×] of catalogue/imaging seed
#   r_scale
#   dx, dy   : ±2" around centroid seed
mcmc_bounds:
  vsys_offset_kms: [-50.0, 50.0]
  gas_sigma: [10.0, 100.0]
  flux_multipliers: [0.5, 2.0]
  gamma: [0.0, 2.0]
  inc_half_width_deg: 15.0
  pa_half_width_deg: 15.0
  dx_half_width_arcsec: 2.0
  dy_half_width_arcsec: 2.0
  vmax_multipliers: [0.25, 4.0]
  r_scale_multipliers: [0.25, 4.0]

mcmc_sampler:
  initial_ball_fraction: 0.05
